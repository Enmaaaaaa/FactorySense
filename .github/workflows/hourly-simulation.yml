name: Hourly Sensor Data Simulation

on:
  schedule:
    - cron: "0 * * * *"   # cada hora
  workflow_dispatch:      # para ejecutarlo manualmente

jobs:
  insert-fake-data:
    runs-on: ubuntu-latest

    steps:
      - name: Insert fake sensor telemetry
        run: |
          curl -i \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{}' \
            https://vocjaerbdjsmqvwmvkud.supabase.co/functions/v1/insert-sensor-data
